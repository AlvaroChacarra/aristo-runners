<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090A0B">
<meta name="description" content="ARISTO RUNNERS · SUMMER 125. Clasificación, progreso y rendimiento del reto de verano.">
<meta name="author" content="Alvaro López-Chacarra">
<title>ARISTO RUNNERS · SUMMER 125</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": ["WebSite", "WebApplication"],
  "name": "ARISTO runners",
  "applicationCategory": "SportsApplication",
  "creator": {"@type": "Person", "name": "Alvaro López-Chacarra"},
  "author": {"@type": "Person", "name": "Alvaro López-Chacarra"}
}
</script>
<style>
  :root{
    --black:#090A0B;--surface:#121416;--surface-raised:#191C1F;--surface-soft:#202327;
    --white:#F4F3EE;--grey:#92989F;--grey-dark:#555B61;--volt:#D8FF3E;
    --danger:#FF453A;--danger-soft:rgba(255,69,58,.10);--gold:#E1B94F;
    --silver:#C5CBD2;--bronze:#B87342;--creator:#62C8FF;
    --display:'Barlow Condensed',sans-serif;--interface:'Inter',sans-serif;
    --metrics:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box}
  html{background:var(--black);scroll-behavior:smooth}
  body{margin:0;min-width:320px;overflow-x:hidden;background:var(--black);color:var(--white);font-family:var(--interface);-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button,a{-webkit-tap-highlight-color:transparent}
  :focus-visible{outline:2px solid var(--volt);outline-offset:4px}
  .shell{width:min(100% - 28px,1200px);margin-inline:auto}
  .topbar{position:sticky;top:0;z-index:30;height:60px;border-bottom:1px solid var(--surface-soft);background:rgba(9,10,11,.95);backdrop-filter:blur(12px)}
  .topbar-inner{height:100%;width:min(100% - 28px,1200px);margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:baseline;gap:6px;min-width:0;font-family:var(--display);font-size:17px;font-weight:900;line-height:1;letter-spacing:.045em;text-transform:uppercase}
  .brand-primary{white-space:nowrap}
  .brand-challenge{color:var(--volt);white-space:nowrap}
  .header-meta{display:flex;align-items:center;gap:10px;font-family:var(--metrics);font-size:9px;letter-spacing:.06em;white-space:nowrap}
  .day-count{color:var(--grey)}
  .creator-signature{position:relative;padding-left:10px;color:var(--white)}
  .creator-signature::before{content:"";position:absolute;left:0;top:50%;width:5px;height:5px;border-radius:50%;background:var(--creator);transform:translateY(-50%)}
  .loading{min-height:72vh;display:grid;place-items:center;font-family:var(--metrics);font-size:11px;letter-spacing:.08em;color:var(--grey)}
  .hero{position:relative;isolation:isolate;overflow:hidden;padding:42px 0 36px;border-bottom:1px solid var(--surface-soft)}
  .hero-grid{position:relative;z-index:2;display:grid;gap:30px}
  .hero-geometry{position:absolute;z-index:-1;inset:0 0 0 auto;width:78%;height:100%;color:var(--grey-dark);opacity:.22;pointer-events:none}
  .hero-watermark{position:absolute;z-index:-1;right:-8px;bottom:-40px;font-family:var(--display);font-size:clamp(180px,45vw,430px);font-weight:900;line-height:.75;color:var(--white);opacity:.025;letter-spacing:-.06em;pointer-events:none}
  .eyebrow{margin:0 0 13px;font-family:var(--metrics);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--volt)}
  .hero-title,.runner-title{margin:0;font-family:var(--display);font-weight:900;text-transform:uppercase;letter-spacing:-.025em}
  .hero-title{max-width:660px;font-size:clamp(48px,13.2vw,82px);line-height:.82}
  .hero-title span{display:block}
  .hero-title .outline{-webkit-text-stroke:1px var(--grey);color:transparent}
  .hero-score{align-self:end}
  .hero-km{display:flex;align-items:flex-end;gap:8px;font-family:var(--display);font-weight:900;line-height:.78}
  .hero-km strong{font-size:clamp(74px,22vw,126px);letter-spacing:-.045em}
  .hero-km span{padding-bottom:5px;font-size:28px;color:var(--volt)}
  .hero-progress-label{display:flex;justify-content:space-between;gap:12px;margin-top:16px;font-family:var(--metrics);font-size:10px;letter-spacing:.06em}
  .hero-progress-label span:last-child{color:var(--grey)}
  .progress-track{height:10px;margin-top:9px;overflow:hidden;background:var(--surface-soft)}
  .progress-fill{display:block;height:100%;max-width:100%;background:var(--volt);transform-origin:left;animation:grow .45s ease-out both}
  .hero-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:22px;border-top:1px solid var(--grey-dark)}
  .hero-metric{min-width:0;padding:13px 10px 0 0}
  .hero-metric+.hero-metric{padding-left:10px;border-left:1px solid var(--surface-soft)}
  .metric-label{display:block;font-family:var(--metrics);font-size:8px;letter-spacing:.09em;color:var(--grey);text-transform:uppercase}
  .metric-value{display:block;margin-top:7px;font-family:var(--metrics);font-size:15px;font-weight:700;line-height:1.15}
  .negative{color:var(--danger)!important}.positive{color:var(--volt)!important}
  .notice{margin-top:18px;padding:12px 14px;border-left:3px solid var(--gold);background:rgba(225,185,79,.08);font-family:var(--metrics);font-size:10px;line-height:1.55;color:var(--silver)}
  .section{margin-top:48px}
  .section-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:17px;border-bottom:1px solid var(--surface-soft);padding-bottom:9px}
  .section-title{margin:0;font-family:var(--display);font-size:28px;font-weight:800;line-height:.9;letter-spacing:.015em;text-transform:uppercase}
  .section-kicker{font-family:var(--metrics);font-size:8px;letter-spacing:.08em;color:var(--grey);text-transform:uppercase;white-space:nowrap}
  .podium{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:"gold gold" "silver bronze";gap:8px;align-items:end}
  .podium-card{position:relative;display:flex;min-width:0;min-height:224px;overflow:hidden;flex-direction:column;padding:17px 14px 15px;background:var(--surface);border-top:3px solid var(--metal);transition:transform .25s ease,background-color .25s ease;animation:reveal .3s ease-out both;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%)}
  .podium-card.gold{grid-area:gold;--metal:var(--gold);min-height:272px;animation-delay:.04s}
  .podium-card.silver{grid-area:silver;--metal:var(--silver);animation-delay:.11s}
  .podium-card.bronze{grid-area:bronze;--metal:var(--bronze);animation-delay:.16s}
  .podium-position{position:absolute;right:8px;top:2px;font-family:var(--display);font-size:96px;font-weight:900;line-height:1;color:var(--metal);opacity:.075}
  .podium-tier{position:relative;z-index:1;font-family:var(--metrics);font-size:8px;font-weight:700;letter-spacing:.12em;color:var(--metal);text-transform:uppercase}
  .podium-name{position:relative;z-index:1;max-width:90%;margin:25px 0 0;font-family:var(--display);font-size:clamp(22px,6.5vw,32px);font-weight:800;line-height:.88;text-transform:uppercase;overflow-wrap:anywhere}
  .podium-card.gold .podium-name{font-size:clamp(30px,8vw,42px)}
  .podium-bottom{position:relative;z-index:1;margin-top:auto;padding-top:22px}
  .podium-km{font-family:var(--display);font-size:34px;font-weight:900;line-height:.85;letter-spacing:-.02em}
  .podium-card.gold .podium-km{font-size:47px}
  .podium-km small{font-size:.44em;color:var(--grey)}
  .podium-meta{display:flex;justify-content:space-between;gap:8px;margin-top:10px;font-family:var(--metrics);font-size:8px;line-height:1.4;color:var(--grey)}
  .badge-line{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:10px}
  .sport-badge,.creator-badge{display:inline-flex;align-items:center;gap:5px;min-height:20px;padding:3px 6px;border:1px solid var(--grey-dark);font-family:var(--metrics);font-size:7px;font-weight:700;line-height:1;letter-spacing:.07em;text-transform:uppercase}
  .sport-badge.leader{border-color:var(--gold);color:var(--gold)}
  .sport-badge.p2{border-color:var(--silver);color:var(--silver)}
  .sport-badge.p3{border-color:var(--bronze);color:var(--bronze)}
  .sport-badge.club,.sport-badge.next,.sport-badge.on-pace{border-color:rgba(216,255,62,.55);color:var(--volt)}
  .sport-badge.red{border-color:var(--danger);color:var(--danger)}
  .sport-badge.chasing{color:var(--grey)}
  .creator-badge{border-color:var(--creator);color:var(--creator)}
  .creator-monogram{padding-right:5px;border-right:1px solid rgba(98,200,255,.35)}
  .standings{border-top:1px solid var(--surface-soft)}
  .runner-row{position:relative;display:grid;grid-template-columns:34px minmax(0,1fr) auto;grid-template-areas:"rank identity distance" ". progress progress" ". gap gap";gap:9px 10px;align-items:center;min-height:112px;padding:15px 8px;border-bottom:1px solid var(--surface-soft);transition:transform .18s ease,background-color .18s ease}
  .runner-row.red-zone{border-left:3px solid var(--danger);background:var(--danger-soft);padding-left:5px}
  .runner-row.creator::after{content:"";position:absolute;top:0;right:0;width:28px;height:2px;background:var(--creator)}
  .row-rank{grid-area:rank;font-family:var(--display);font-size:29px;font-weight:900;line-height:1;color:var(--grey)}
  .red-zone .row-rank{color:var(--danger)}
  .row-identity{grid-area:identity;min-width:0}
  .row-name{font-family:var(--display);font-size:20px;font-weight:800;line-height:.92;text-transform:uppercase;overflow-wrap:anywhere}
  .row-badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
  .row-progress{grid-area:progress;min-width:0}
  .row-track{height:5px;overflow:hidden;background:var(--surface-soft)}
  .row-track span{display:block;height:100%;max-width:100%;background:var(--volt);transform-origin:left;animation:grow .4s ease-out both}
  .red-zone .row-track span{background:var(--danger)}
  .row-progress-meta{display:flex;justify-content:space-between;margin-top:6px;font-family:var(--metrics);font-size:8px;color:var(--grey)}
  .row-distance{grid-area:distance;text-align:right;font-family:var(--display);font-size:29px;font-weight:900;line-height:.8;white-space:nowrap}
  .row-distance small{display:block;margin-top:6px;font-family:var(--metrics);font-size:8px;color:var(--grey)}
  .row-gap{grid-area:gap;text-align:right;font-family:var(--metrics);font-size:8px;color:var(--grey);text-transform:uppercase}
  .relegation-cut{display:flex;align-items:center;gap:10px;padding:24px 0 15px;color:var(--danger);font-family:var(--metrics);font-size:8px;font-weight:700;letter-spacing:.11em;text-transform:uppercase}
  .relegation-cut::before,.relegation-cut::after{content:"";flex:1;border-top:1px dashed var(--danger)}
  .chart-card{position:relative;padding:18px 0 12px;border-top:2px solid var(--volt);border-bottom:1px solid var(--surface-soft)}
  .chart-wrap{position:relative;height:300px}
  .chart-note{margin:11px 0 0;font-family:var(--metrics);font-size:8px;line-height:1.55;color:var(--grey)}
  .chart-gap{display:flex;justify-content:flex-end;margin-top:10px;font-family:var(--metrics);font-size:10px;font-weight:700;letter-spacing:.05em}
  .chart-fallback{height:100%;display:grid;place-items:center;padding:30px;text-align:center;background:var(--surface);font-family:var(--metrics);font-size:10px;line-height:1.5;color:var(--grey)}
  .performance-grid{display:grid;gap:8px}
  .performance-card{display:grid;grid-template-columns:36px 1fr;gap:12px;min-height:116px;padding:16px 14px;background:var(--surface);border-top:2px solid var(--surface-soft);transition:transform .18s ease,border-color .18s ease}
  .performance-icon{width:32px;height:32px;color:var(--volt)}
  .performance-label{font-family:var(--metrics);font-size:8px;font-weight:700;letter-spacing:.1em;color:var(--volt);text-transform:uppercase}
  .performance-name{margin-top:8px;font-family:var(--display);font-size:22px;font-weight:800;line-height:.92;text-transform:uppercase}
  .performance-value{margin-top:7px;font-family:var(--metrics);font-size:9px;color:var(--grey)}
  .data-status{padding:16px 0 6px;border-top:1px solid var(--surface-soft)}
  .data-status-title{display:flex;align-items:center;gap:8px;font-family:var(--metrics);font-size:9px;font-weight:700;letter-spacing:.08em}
  .data-dot{width:6px;height:6px;border-radius:50%;background:var(--volt)}
  .data-dot.consolidated{background:var(--gold)}
  .data-status p{margin:9px 0 0;font-family:var(--metrics);font-size:8px;line-height:1.55;color:var(--grey)}
  .site-footer{margin-top:52px;padding:24px 0 calc(30px + env(safe-area-inset-bottom));border-top:1px solid var(--surface-soft);font-family:var(--metrics);font-size:8px;line-height:1.8;letter-spacing:.04em;color:var(--grey);text-transform:uppercase}
  .footer-brand{color:var(--white);font-weight:700}
  .footer-author{color:var(--creator)}
  .back{display:inline-flex;align-items:center;min-height:48px;margin-top:9px;font-family:var(--metrics);font-size:9px;color:var(--grey);text-transform:uppercase}
  .back svg{width:16px;height:16px;margin-right:7px}
  .runner-hero{position:relative;overflow:hidden;margin-top:4px;padding:34px 0 32px;border-bottom:1px solid var(--surface-soft)}
  .runner-hero::before{content:"";position:absolute;top:0;left:0;width:72px;height:3px;background:var(--state-color,var(--volt))}
  .runner-hero.creator-profile::after{content:"ALC";position:absolute;right:-5px;bottom:-25px;font-family:var(--display);font-size:150px;font-weight:900;line-height:1;color:var(--creator);opacity:.035}
  .runner-hero-grid{position:relative;z-index:1;display:grid;gap:26px}
  .runner-title{max-width:780px;font-size:clamp(49px,15vw,90px);line-height:.82;overflow-wrap:anywhere}
  .runner-state-gold{--state-color:var(--gold)}.runner-state-silver{--state-color:var(--silver)}.runner-state-bronze{--state-color:var(--bronze)}.runner-state-red{--state-color:var(--danger)}
  .runner-score{align-self:end}
  .runner-total-value{font-family:var(--display);font-size:clamp(76px,22vw,120px);font-weight:900;line-height:.74;letter-spacing:-.045em;color:var(--state-color,var(--white))}
  .runner-total-value small{font-size:.26em;color:var(--grey)}
  .runner-total-meta{display:flex;justify-content:space-between;gap:12px;margin-top:20px;font-family:var(--metrics);font-size:9px;line-height:1.5}
  .runner-total-meta span:last-child{text-align:right;color:var(--grey)}
  .creator-panel{display:flex;align-items:center;gap:10px;margin-top:18px;padding:11px 12px;border-left:2px solid var(--creator);background:rgba(98,200,255,.06);font-family:var(--metrics);font-size:8px;letter-spacing:.09em;color:var(--creator);text-transform:uppercase}
  .summary-strip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--surface-soft);border-bottom:1px solid var(--surface-soft)}
  .summary-stat{min-width:0;padding:15px 10px 15px 0}
  .summary-stat:nth-child(even){padding-left:10px;border-left:1px solid var(--surface-soft)}
  .summary-stat:nth-child(n+3){border-top:1px solid var(--surface-soft)}
  .summary-stat strong{display:block;margin-top:10px;font-family:var(--display);font-size:28px;font-weight:900;line-height:.85}
  .summary-stat small{font-family:var(--metrics);font-size:8px;color:var(--grey)}
  .observable-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;margin-top:10px;background:var(--surface-soft)}
  .observable-stat{min-width:0;padding:14px;background:var(--surface)}
  .observable-stat strong{display:block;margin-top:9px;font-family:var(--metrics);font-size:16px}
  .training-mix{margin-top:10px;padding:15px;background:var(--surface)}
  .mix-row{display:grid;grid-template-columns:86px 1fr 22px;align-items:center;gap:9px;margin-top:11px;font-family:var(--metrics);font-size:8px;color:var(--grey)}
  .mix-track{height:5px;background:var(--surface-soft)}
  .mix-track span{display:block;height:100%;background:var(--volt)}
  .activity-list{border-top:1px solid var(--surface-soft)}
  .activity{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:15px 4px;border-bottom:1px solid var(--surface-soft)}
  .activity-date,.activity-basis{font-family:var(--metrics);font-size:8px;color:var(--grey);text-transform:uppercase}
  .activity-distance{margin-top:6px;font-family:var(--display);font-size:34px;font-weight:900;line-height:.85}
  .activity-metrics{display:grid;grid-template-columns:1fr 1fr;align-content:end;gap:8px;text-align:right}
  .activity-metric strong{display:block;font-family:var(--metrics);font-size:11px}
  .activity-metric span{font-family:var(--metrics);font-size:7px;color:var(--grey)}
  .empty{padding:20px;border-left:2px solid var(--grey-dark);background:var(--surface);font-size:11px;line-height:1.6;color:var(--grey)}
  .milestones{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .milestone{position:relative;min-height:142px;padding:17px 13px 14px;background:var(--surface);border-top:2px solid var(--surface-soft)}
  .milestone.done{border-top-color:var(--volt)}
  .milestone.detected{border-top-color:var(--gold)}
  .milestone-pct{font-family:var(--display);font-size:42px;font-weight:900;line-height:.8;color:var(--grey)}
  .milestone.done .milestone-pct{color:var(--volt)}
  .milestone.detected .milestone-pct{color:var(--gold)}
  .milestone-target{margin-top:11px;font-family:var(--metrics);font-size:8px;color:var(--grey)}
  .milestone-state{margin-top:16px;font-family:var(--metrics);font-size:7px;line-height:1.55;color:var(--grey);text-transform:uppercase}
  .quality-card{display:grid;gap:1px;background:var(--surface-soft)}
  .quality-item{padding:15px;background:var(--surface)}
  .quality-item strong{display:block;font-family:var(--metrics);font-size:8px;letter-spacing:.06em;color:var(--white);text-transform:uppercase}
  .quality-item span{display:block;margin-top:7px;font-size:9px;line-height:1.55;color:var(--grey)}
  @keyframes reveal{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @media (min-width:431px){
    .shell,.topbar-inner{width:min(100% - 40px,1200px)}
    .hero{padding-top:52px}.podium{gap:12px}.podium-card{padding:20px;min-height:245px}.podium-card.gold{min-height:292px}
    .runner-row{padding-inline:12px}.performance-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .activity{grid-template-columns:1.1fr 1fr}.quality-card{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  .podium.compact-field{grid-template-columns:1fr;grid-template-areas:none}
  .podium.compact-field .podium-card{grid-area:auto;min-height:220px}
  @media (min-width:768px){
    .topbar{height:64px}.brand{font-size:20px}.header-meta{font-size:10px;gap:16px}
    .hero{padding:68px 0 52px}.hero-grid{grid-template-columns:7fr 5fr;gap:48px}.hero-score{padding-bottom:3px}
    .podium{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-areas:"silver gold bronze";gap:14px}
    .podium-card{min-height:282px;padding:22px}.podium-card.gold{min-height:334px}.podium-card.gold .podium-name{font-size:42px}
    .podium-name{font-size:31px}.podium-card.gold .podium-km{font-size:52px}.podium-km{font-size:40px}
    .runner-row{grid-template-columns:44px minmax(0,1.15fr) minmax(130px,1.3fr) 92px 110px;grid-template-areas:"rank identity progress distance gap";gap:10px;min-height:88px;padding:14px 12px}
    .row-rank{font-size:35px}.row-name{font-size:23px}.row-distance{font-size:32px}.row-gap{font-size:8px}.row-progress-meta{font-size:8px}
    .performance-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.performance-card{grid-template-columns:1fr;min-height:180px}
    .chart-wrap{height:360px}.runner-hero{padding:52px 0 48px}.runner-hero-grid{grid-template-columns:7fr 5fr;gap:50px}
    .summary-strip{grid-template-columns:repeat(4,minmax(0,1fr))}.summary-stat{padding:20px 16px}.summary-stat+.summary-stat{border-left:1px solid var(--surface-soft)}.summary-stat:nth-child(n+3){border-top:0}
    .observable-summary{grid-template-columns:repeat(4,minmax(0,1fr))}.activity{grid-template-columns:1.3fr 1fr}.activity-metrics{grid-template-columns:repeat(3,1fr)}
    .milestones{grid-template-columns:repeat(4,minmax(0,1fr))}.milestone{min-height:170px}.quality-card{grid-template-columns:repeat(3,minmax(0,1fr))}
    .site-footer{display:flex;justify-content:space-between;gap:20px}
  }
  @media (min-width:1100px){
    .section{margin-top:64px}.section-title{font-size:34px}.hero-title{font-size:92px}.hero-grid{gap:72px}
    .podium-card{padding:26px}.podium-card.gold{min-height:354px}.runner-row{grid-template-columns:62px minmax(250px,1.2fr) minmax(280px,1.45fr) 132px 150px;padding-inline:18px}

    .podium{grid-template-columns:1fr;grid-template-areas:"gold" "silver" "bronze"}.podium-card,.podium-card.gold{min-height:220px}.podium-card.gold .podium-name{font-size:32px}
    .section-kicker{display:none}
  }

<body>
<header class="topbar" id="siteHeader"></header>
<main class="shell" id="app"><div class="loading" role="status">CARGANDO SUMMER 125…</div></main>
<footer class="shell site-footer" id="siteFooter" hidden></footer>

<script>
const app=document.getElementById("app");
const siteHeader=document.getElementById("siteHeader");
const siteFooter=document.getElementById("siteFooter");
let dashboard=null;
let charts=[];
let hasRendered=false;

/* TESTABLE_COMPETITION_LOGIC_START */
const SITE={
  name:"ARISTO RUNNERS",
  challengeName:"SUMMER 125",
  authorName:"Alvaro López-Chacarra",
  authorSlug:"alvaro-lopez-chacarra",
  authorShort:"ALC",
  authorRole:"CREATOR"
};
const relegationCount=3;
const fmt=(value,digits=1)=>value===null||value===undefined||Number.isNaN(Number(value))?"—":Number(value).toLocaleString("es-ES",{minimumFractionDigits:digits,maximumFractionDigits:digits,useGrouping:true});
const esc=value=>String(value===null||value===undefined?"":value).replace(/[&<>'"]/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[char]));
const targetWidth=value=>Math.max(0,Math.min(100,Number(value)||0));
const routeHref=slug=>"?runner="+encodeURIComponent(slug);
function isCreator(runner){return Boolean(runner&&runner.slug===SITE.authorSlug)}
function getPodiumTier(runner){return runner&&runner.rank===1?"gold":runner&&runner.rank===2?"silver":runner&&runner.rank===3?"bronze":null}
function getLastSafeRank(runners){return Math.max(0,(Array.isArray(runners)?runners.length:0)-relegationCount)}
function isRelegationRunner(runner,runners){return Boolean(runner&&runner.rank>getLastSafeRank(runners))}
function isRelegationCutInPodium(runners){return Array.isArray(runners)&&runners.length>0&&getLastSafeRank(runners)<3}
function getNextFinisher(runners){
  return (Array.isArray(runners)?runners:[])
    .filter(runner=>runner.completed===false&&Number.isFinite(Number(runner.remaining_km)))
    .slice()
    .sort((a,b)=>Number(a.remaining_km)-Number(b.remaining_km)||Number(a.rank)-Number(b.rank))[0]||null;
}
function getRunnerCompetitionState(runner,runners){
  const states=[];
  const next=getNextFinisher(runners);
  if(runner.rank===1)states.push("LEADER");
  else if(runner.rank===2)states.push("P2");
  else if(runner.rank===3)states.push("P3");
  if(runner.completed===true)states.push("125 CLUB");
  else if(next&&next.slug===runner.slug)states.push("NEXT FINISHER");
  if(runner.on_track===true&&!states.includes("LEADER"))states.push("ON PACE");
  if(isRelegationRunner(runner,runners))states.push("ZONA ROJA");
  if(states.length===0)states.push("CHASING");
  return states;
}
function badgeClass(state){
  return state==="LEADER"?"leader":state==="P2"?"p2":state==="P3"?"p3":state==="125 CLUB"?"club":state==="NEXT FINISHER"?"next":state==="ON PACE"?"on-pace":state==="ZONA ROJA"?"red":"chasing";
}
function stateBadges(runner,runners){
  return getRunnerCompetitionState(runner,runners).map(state=>'<span class="sport-badge '+badgeClass(state)+'">'+state+'</span>').join("");
}
function creatorBadge(runner){
  return isCreator(runner)?'<span class="creator-badge"><span class="creator-monogram">'+SITE.authorShort+'</span>'+SITE.authorRole+'</span>':"";
}
function renderRunnerRow(runner,runners,objective){
  const red=isRelegationRunner(runner,runners);
  const completed=runner.completed===true;
  const gap=completed?Math.max(0,Number(runner.km||0)-Number(objective||0)):runner.remaining_km;
  const gapText=completed?"+"+fmt(gap)+" KM SOBRE OBJETIVO":fmt(gap)+" KM PARA "+fmt(objective,0);
  return '<a class="runner-row'+(red?" red-zone":"")+(isCreator(runner)?" creator":"")+'" href="'+routeHref(runner.slug)+'" data-route data-runner-slug="'+esc(runner.slug)+'" data-rank="'+runner.rank+'" data-relegation="'+red+'" aria-label="Ver rendimiento de '+esc(runner.name)+'">'+
    '<div class="row-rank">'+String(Number(runner.rank)||0).padStart(2,"0")+'</div>'+
    '<div class="row-identity"><div class="row-name">'+esc(runner.name||"Runner")+'</div><div class="row-badges">'+creatorBadge(runner)+stateBadges(runner,runners)+'</div></div>'+
    '<div class="row-progress"><div class="row-track" role="progressbar" aria-label="Progreso de '+esc(runner.name||"Runner")+'" aria-valuenow="'+targetWidth(runner.progress_pct)+'" aria-valuemin="0" aria-valuemax="100" aria-valuetext="'+fmt(runner.progress_pct)+'%"><span style="width:'+targetWidth(runner.progress_pct)+'%"></span></div><div class="row-progress-meta"><span>'+fmt(runner.progress_pct)+'%</span><span>'+gapText+'</span></div></div>'+
    '<div class="row-distance">'+fmt(runner.km)+'<small>KM</small></div>'+
    '<div class="row-gap">'+gapText+'</div></a>';
}
/* TESTABLE_COMPETITION_LOGIC_END */

const parseDate=value=>value?new Date(String(value).length===10?String(value)+"T12:00:00":value):null;
const fmtDate=value=>{const date=parseDate(value);return date&&!Number.isNaN(date.valueOf())?date.toLocaleDateString("es-ES",{day:"2-digit",month:"short"}).replace(".","").toUpperCase():"—"};
const fmtDateTime=value=>{const date=parseDate(value);return date&&!Number.isNaN(date.valueOf())?date.toLocaleString("es-ES",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"—"};
const fmtPace=value=>{if(value===null||value===undefined||!Number.isFinite(Number(value)))return "—";const seconds=Math.round(Number(value)*60);return Math.floor(seconds/60)+":"+String(seconds%60).padStart(2,"0")};
const signed=value=>(Number(value)>=0?"+":"−")+fmt(Math.abs(Number(value)||0));
const routeSlug=()=>new URLSearchParams(location.search).get("runner");
const dataDay=data=>Math.max(1,Math.min(data.challenge.days,Math.round((parseDate(data.data_through)-parseDate(data.challenge.start))/86400000)+1));
const qualityDate=()=>fmtDateTime(dashboard.quality.last_complete_observation);
const sectionHeading=(title,kicker)=>'<div class="section-heading"><h2 class="section-title">'+title+'</h2>'+(kicker?'<span class="section-kicker">'+kicker+'</span>':"")+'</div>';

function destroyCharts(){charts.forEach(chart=>chart.destroy());charts=[]}
function renderHeader(){
  const challenge=dashboard.challenge;
  siteHeader.innerHTML='<div class="topbar-inner"><a class="brand" href="./" data-route aria-label="Volver a la clasificación"><span class="brand-primary">'+SITE.name+' //</span><span class="brand-challenge">'+SITE.challengeName+'</span></a><div class="header-meta"><span class="day-count">'+(challenge.finished?"FINAL":'DÍA '+challenge.current_day+' / '+challenge.days)+'</span><a class="creator-signature" href="'+routeHref(SITE.authorSlug)+'" data-route title="Página creada por '+SITE.authorName+'" aria-label="Página creada por '+SITE.authorName+'">BY '+SITE.authorShort+'</a></div></div>';
}
function renderFooter(){
  siteFooter.hidden=false;
  siteFooter.innerHTML='<div><span class="footer-brand">'+SITE.name+' · '+SITE.challengeName+'</span><br>Powered by Strava data</div><a class="footer-author" href="'+routeHref(SITE.authorSlug)+'" data-route>Designed &amp; built by '+SITE.authorName+'</a>';
}
function heroEyebrow(){
  if(dashboard.challenge.finished)return "FINAL STANDINGS";
  return dashboard.challenge.days-dashboard.challenge.current_day<=7?"SPRINT FINAL":SITE.challengeName;
}
function renderHero(){
  const challenge=dashboard.challenge;
  const summary=dashboard.summary;
  const projection=challenge.finished?summary.total_km:summary.projection_km;
  const gap=challenge.finished?summary.total_km-challenge.objective_total_km:summary.projection_gap_km;
  return '<section class="hero">'+
    '<svg class="hero-geometry" viewBox="0 0 900 430" preserveAspectRatio="none" aria-hidden="true"><path d="M940 20C630 22 530 102 414 430" fill="none" stroke="currentColor" stroke-width="3"/><path d="M970 62C670 58 575 128 468 430" fill="none" stroke="currentColor" stroke-width="2"/><path d="M1000 106C710 96 625 155 522 430" fill="none" stroke="currentColor"/><path d="M612 38h112M642 57h112M672 76h112" stroke="currentColor" stroke-width="2"/><path d="M740 270l30-20M778 270l30-20M816 270l30-20" stroke="currentColor" stroke-width="3"/></svg>'+
    '<span class="hero-watermark" aria-hidden="true">'+fmt(challenge.objective_per_runner_km,0)+'</span>'+
    '<div class="hero-grid"><div><p class="eyebrow">'+heroEyebrow()+'</p><h1 class="hero-title"><span>'+challenge.days+' DÍAS.</span><span>'+summary.participants+' RUNNERS.</span><span class="outline">'+fmt(challenge.objective_total_km,0)+' KM.</span></h1></div>'+
    '<div class="hero-score"><div class="hero-km"><strong>'+fmt(summary.total_km)+'</strong><span>KM</span></div>'+
    '<div class="hero-progress-label"><span>'+fmt(summary.progress_pct)+'% COMPLETADO</span><span>'+fmt(challenge.objective_total_km,0)+' KM</span></div>'+
    '<div class="progress-track" role="progressbar" aria-label="Progreso colectivo" aria-valuenow="'+targetWidth(summary.progress_pct)+'" aria-valuemin="0" aria-valuemax="100" aria-valuetext="'+fmt(summary.progress_pct)+'%"><span class="progress-fill" style="width:'+targetWidth(summary.progress_pct)+'%"></span></div>'+
    '<div class="hero-metrics"><div class="hero-metric"><span class="metric-label">'+(challenge.finished?"Resultado":"Proyección")+'</span><strong class="metric-value">'+fmt(projection)+' KM</strong></div><div class="hero-metric"><span class="metric-label">Vs objetivo</span><strong class="metric-value '+(gap>=0?"positive":"negative")+'">'+signed(gap)+' KM</strong></div><div class="hero-metric"><span class="metric-label">Finishers</span><strong class="metric-value">'+summary.completed_runners+' / '+summary.participants+'</strong></div></div></div></div>'+
    (dashboard.coverage.needs_current_baseline?'<div class="notice">La automatización está conectada; falta el checkpoint actual para activar los incrementos.</div>':"")+
    '</section>';
}
function podiumDelta(runner){
  const objective=dashboard.challenge.objective_per_runner_km;
  const delta=Number(runner.km||0)-objective;
  return delta>=0?signed(delta)+" KM OVER TARGET":fmt(Math.abs(delta))+" KM TO "+fmt(objective,0);
}
function renderPodiumCard(runner){
  const tier=getPodiumTier(runner);
  const tierLabel=tier==="gold"?"LEADER":tier==="silver"?"SILVER":"BRONZE";
  return '<a class="podium-card '+tier+(isCreator(runner)?" creator":"")+'" href="'+routeHref(runner.slug)+'" data-route data-medal="'+tier+'" data-rank="'+runner.rank+'" aria-label="'+tierLabel+': '+esc(runner.name)+'">'+
    '<span class="podium-position" aria-hidden="true">'+String(runner.rank).padStart(2,"0")+'</span><span class="podium-tier">'+tierLabel+'</span>'+
    '<h3 class="podium-name">'+esc(runner.name)+'</h3><div class="podium-bottom"><div class="podium-km">'+fmt(runner.km)+' <small>KM</small></div>'+
    '<div class="podium-meta"><span>'+fmt(runner.progress_pct)+'%</span><span>'+podiumDelta(runner)+'</span></div>'+
    '<div class="badge-line">'+creatorBadge(runner)+(runner.completed?'<span class="sport-badge club">125 CLUB</span>':"")+(isRelegationRunner(runner,dashboard.runners)?'<span class="sport-badge red">ZONA ROJA</span>':"")+'</div></div></a>';
}
function renderPodium(){
  const runners=dashboard.runners.slice().sort((a,b)=>a.rank-b.rank);
  const podium=runners.filter(runner=>runner.rank<=3);
  const cutInPodium=isRelegationCutInPodium(runners);
  let cutInserted=false;
  const cards=podium.map(runner=>{
    let cut="";
    if(cutInPodium&&!cutInserted&&isRelegationRunner(runner,runners)){cut=renderRelegationCut();cutInserted=true}
    return cut+renderPodiumCard(runner);
  }).join("");
  return '<section class="section" id="podium" data-testid="podium">'+sectionHeading("PODIUM","TOP 3 · CLASIFICACIÓN ACTUAL")+
    (podium.length?'<div class="podium'+(cutInPodium?" compact-field":"")+'">'+cards+'</div>':'<div class="empty">El podium se publicará cuando exista una clasificación válida.</div>')+'</section>';
}
function renderRelegationCut(){
  return '<div class="relegation-cut" data-testid="relegation-cut" role="separator" aria-label="Corte de descenso"><span>CORTE DE DESCENSO</span></div>';
}
function renderStandings(){
  const runners=dashboard.runners.slice().sort((a,b)=>a.rank-b.rank);
  const rows=runners.filter(runner=>runner.rank>3);
  const cutInPodium=isRelegationCutInPodium(runners);
  let cutInserted=false;
  const html=rows.map(runner=>{
    let cut="";
    if(!cutInPodium&&!cutInserted&&isRelegationRunner(runner,runners)){cut=renderRelegationCut();cutInserted=true}
    return cut+renderRunnerRow(runner,runners,dashboard.challenge.objective_per_runner_km);
  }).join("");
  return '<section class="section" id="standings" data-testid="standings">'+sectionHeading("CLASIFICACIÓN","TOCA PARA VER DETALLE")+
    (rows.length?'<div class="standings">'+html+'</div>':'<div class="empty">La clasificación completa aparecerá cuando haya más de tres participantes.</div>')+'</section>';
}
const endLabelsPlugin={
  id:"aristoEndLabels",
  afterDatasetsDraw(chart,args,options){
    const labels=options&&options.labels||[];
    const ctx=chart.ctx;
    ctx.save();
    ctx.font="700 9px 'JetBrains Mono'";
    ctx.textBaseline="middle";
    labels.forEach(label=>{
      const meta=chart.getDatasetMeta(label.datasetIndex);
      const point=meta&&meta.data&&meta.data[label.index];
      if(!point||point.skip)return;
      const props=point.getProps(["x","y"],true);
      const width=ctx.measureText(label.text).width+10;
      const x=Math.min(chart.chartArea.right-width,Math.max(chart.chartArea.left,props.x-width/2));
      const y=Math.max(chart.chartArea.top+8,Math.min(chart.chartArea.bottom-8,props.y+(label.offsetY||0)));
      ctx.fillStyle=label.background||"#121416";
      ctx.fillRect(x,y-9,width,18);
      ctx.fillStyle=label.color||"#F4F3EE";
      ctx.fillText(label.text,x+5,y);
    });
    ctx.restore();
  }
};
function chartBaseOptions(endLabels){
  return {responsive:true,maintainAspectRatio:false,interaction:{mode:"index",intersect:false},plugins:{
    legend:{display:true,position:"top",align:"start",labels:{color:"#92989F",usePointStyle:true,boxWidth:7,boxHeight:7,padding:16,font:{family:"'JetBrains Mono', monospace",size:9}}},
    tooltip:{callbacks:{label:context=>context.dataset.label+": "+fmt(context.parsed.y)+" km"}},
    aristoEndLabels:{labels:endLabels||[]}
  },layout:{padding:{right:8}},scales:{
    x:{grid:{display:false},border:{color:"#202327"},ticks:{color:"#92989F",font:{family:"'JetBrains Mono', monospace",size:8},maxTicksLimit:9}},
    y:{grid:{color:"rgba(146,152,159,.12)"},border:{display:false},ticks:{color:"#92989F",font:{family:"'JetBrains Mono', monospace",size:8},callback:value=>value+" km"}}
  }};
}
function chartUnavailable(canvas){
  canvas.parentElement.innerHTML='<div class="chart-fallback">El gráfico no está disponible. La clasificación y las métricas siguen operativas.</div>';
}
function renderGroupChart(){
  const canvas=document.getElementById("groupChart");
  if(!canvas)return;
  if(typeof Chart==="undefined"){chartUnavailable(canvas);return}
  const day=dataDay(dashboard);
  const totals=dashboard.series.labels.map((_,index)=>dashboard.series.datasets.reduce((sum,set)=>sum+Number(set.cumulative_km[index]||0),0));
  const anchor=totals[day-1]||0;
  const actual=totals.map((value,index)=>index<day?Math.round(value*100)/100:null);
  const projection=totals.map((_,index)=>index<day-1?null:Math.round((anchor/day)*(index+1)*10)/10);
  const target=totals.map((_,index)=>Math.round(dashboard.challenge.objective_total_km*(index+1)/dashboard.challenge.days*10)/10);
  const last=dashboard.series.labels.length-1;
  const labels=[{datasetIndex:0,index:day-1,text:fmt(dashboard.summary.total_km,0)+" KM",color:"#090A0B",background:"#D8FF3E"}];
  if(!dashboard.challenge.finished)labels.push({datasetIndex:1,index:last,text:fmt(dashboard.summary.projection_km,0)+" KM",background:"#191C1F"});
  labels.push({datasetIndex:2,index:last,text:"TARGET "+fmt(dashboard.challenge.objective_total_km,0),color:"#92989F",background:"#121416"});
  charts.push(new Chart(canvas,{type:"line",data:{labels:dashboard.series.labels.map((_,index)=>"D"+(index+1)),datasets:[
    {label:"Real",data:actual,borderColor:"#D8FF3E",backgroundColor:"#D8FF3E",borderWidth:3,pointRadius:context=>context.dataIndex===day-1?4:0,tension:.22,fill:false},
    {label:"Proyección",data:dashboard.challenge.finished?[]:projection,borderColor:"#F4F3EE",backgroundColor:"#F4F3EE",borderWidth:2,borderDash:[7,5],pointRadius:0,tension:.2,fill:false},
    {label:"Objetivo",data:target,borderColor:"#92989F",backgroundColor:"#92989F",borderWidth:1.5,borderDash:[2,5],pointRadius:0,fill:false}
  ]},options:chartBaseOptions(labels),plugins:[endLabelsPlugin]}));
}
function iconSvg(kind){
  const common='viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"';
  if(kind==="next")return '<svg '+common+'><circle cx="16" cy="16" r="10"/><circle cx="16" cy="16" r="4"/><path d="M16 2v5M16 25v5M2 16h5M25 16h5"/></svg>';
  if(kind==="longest")return '<svg '+common+'><path d="M5 25c4-13 8-17 12-9s6 6 10-8"/><circle cx="5" cy="25" r="2"/><path d="M24 5h5v5"/></svg>';
  if(kind==="milestone")return '<svg '+common+'><path d="M8 28V5h15l-3 5 3 5H8"/><path d="M12 9h2M16 9h2M12 13h2M16 13h2"/></svg>';
  return '<svg '+common+'><path d="M7 28V5h16l-3 6 3 6H7"/><path d="M7 23h18"/></svg>';
}
function performanceCards(){
  const leader=dashboard.runners.slice().sort((a,b)=>a.rank-b.rank)[0];
  const next=getNextFinisher(dashboard.runners);
  const cards=dashboard.highlights&&Array.isArray(dashboard.highlights.cards)?dashboard.highlights.cards:[];
  const longest=cards.find(card=>card.kind==="longest_tracked");
  const milestone=cards.find(card=>card.kind==="latest_milestone");
  return [
    leader&&{kind:"leader",label:"LEADER",name:leader.name,slug:leader.slug,value:fmt(leader.km)+" KM"},
    next&&{kind:"next",label:"NEXT FINISHER",name:next.name,slug:next.slug,value:fmt(next.remaining_km)+" KM PARA "+fmt(dashboard.challenge.objective_per_runner_km,0)},
    longest&&{kind:"longest",label:"LONGEST RUN",name:longest.name,slug:longest.runner_slug,value:longest.value},
    milestone&&{kind:"milestone",label:"LATEST MILESTONE",name:milestone.name,slug:milestone.runner_slug,value:milestone.value}
  ].filter(Boolean).slice(0,4);
}
function renderPerformance(){
  const cards=performanceCards();
  return '<section class="section">'+sectionHeading("PERFORMANCE","HIGHLIGHTS")+'<div class="performance-grid">'+cards.map(card=>
    '<a class="performance-card" href="'+routeHref(card.slug)+'" data-route><span class="performance-icon">'+iconSvg(card.kind)+'</span><div><div class="performance-label">'+card.label+'</div><div class="performance-name">'+esc(card.name)+'</div><div class="performance-value">'+esc(card.value)+'</div></div></a>'
  ).join("")+'</div></section>';
}
function renderDataStatus(){
  const pending=dashboard.coverage.needs_current_baseline;
  const live=dashboard.quality.tracking_active&&!pending;
  const status=live?"LIVE":"CONSOLIDATED";
  const detail="Datos consolidados hasta "+fmtDate(dashboard.data_through)+" · "+(live?"Seguimiento incremental activo":"Último estado válido disponible");
  const feed=dashboard.quality.last_feed_check?" · Feed consultado "+fmtDateTime(dashboard.quality.last_feed_check):"";
  const elevation=dashboard.summary.elevation_total_complete?"":" El desnivel acumulado es parcial porque el histórico solo aporta kilómetros.";
  const late=Number(dashboard.quality.late_observation_count||0)>0?" "+dashboard.quality.late_observation_count+" actividad(es) detectada(s) el 31/08 se imputan al cierre del 30/08.":"";
  return '<section class="section data-status" aria-labelledby="data-status-title"><div class="data-status-title" id="data-status-title">DATA STATUS <span class="data-dot'+(live?"":" consolidated")+'"></span> '+status+'</div><p>'+detail+feed+'. Los tramos sin detalle diario se interpolan; las métricas de actividad solo cubren el periodo observable.'+late+elevation+'</p></section>';
}
function renderHome(){
  document.title=SITE.name+" · "+SITE.challengeName;
  app.innerHTML=renderHero()+renderPodium()+renderStandings()+
    '<section class="section">'+sectionHeading("PACE TO "+fmt(dashboard.challenge.objective_total_km,0),"EVOLUCIÓN DEL CLUB")+'<div class="chart-card"><div class="chart-wrap"><canvas id="groupChart" role="img" aria-label="Evolución del club: real, proyección y objetivo"></canvas></div><div class="chart-gap '+(dashboard.summary.projection_gap_km<0?"negative":"positive")+'">'+signed(dashboard.summary.projection_gap_km)+' KM VS OBJETIVO</div><p class="chart-note">Real = total consolidado · Proyección = ritmo actual · Objetivo = trayectoria necesaria. Los intervalos sin desglose diario son aproximados.</p></div></section>'+
    renderPerformance()+renderDataStatus();
  renderGroupChart();
}
function runnerVisualClass(runner){
  if(runner.rank===1)return "runner-state-gold";
  if(runner.rank===2)return "runner-state-silver";
  if(runner.rank===3)return "runner-state-bronze";
  if(isRelegationRunner(runner,dashboard.runners))return "runner-state-red";
  return "";
}
function runnerPrimaryCopy(runner){
  const states=getRunnerCompetitionState(runner,dashboard.runners);
  return states.filter(state=>state!=="125 CLUB"&&state!=="ON PACE")[0]||states[0];
}
function renderRunnerHero(runner){
  const objective=dashboard.challenge.objective_per_runner_km;
  const remaining=runner.completed?Math.max(0,Number(runner.km)-objective):runner.remaining_km;
  const gap=runner.completed?signed(remaining)+" KM OVER TARGET":fmt(remaining)+" KM TO "+fmt(objective,0);
  return '<section class="runner-hero '+runnerVisualClass(runner)+(isCreator(runner)?" creator-profile":"")+'"><div class="runner-hero-grid"><div>'+
    '<p class="eyebrow">PUESTO '+String(runner.rank).padStart(2,"0")+' · '+(isCreator(runner)?"CREATOR OF "+SITE.name:runnerPrimaryCopy(runner))+'</p>'+
    '<h1 class="runner-title" tabindex="-1">'+esc(runner.name)+'</h1><div class="badge-line">'+creatorBadge(runner)+stateBadges(runner,dashboard.runners)+'</div>'+
    (isCreator(runner)?'<div class="creator-panel"><span class="creator-monogram">'+SITE.authorShort+'</span> CREATED BY '+SITE.authorShort+'</div>':"")+
    '</div><div class="runner-score"><div class="runner-total-value">'+fmt(runner.km)+' <small>KM</small></div><div class="runner-total-meta"><span>'+fmt(runner.progress_pct)+'%</span><span>'+gap+'</span></div>'+
    '<div class="progress-track" role="progressbar" aria-label="Progreso de '+esc(runner.name)+'" aria-valuenow="'+targetWidth(runner.progress_pct)+'" aria-valuemin="0" aria-valuemax="100" aria-valuetext="'+fmt(runner.progress_pct)+'%"><span class="progress-fill" style="width:'+targetWidth(runner.progress_pct)+'%"></span></div></div></div></section>';
}
function distributionHtml(tracked){
  const distribution=tracked.distribution||{};
  const rows=[["< 5 KM",distribution.short_under_5k||0],["5–10 KM",distribution.medium_5_to_10k||0],["10+ KM",distribution.long_10k_plus||0]];
  const max=Math.max(1,...rows.map(row=>Number(row[1])||0));
  return '<div class="training-mix"><span class="metric-label">TRAINING MIX · PERIODO OBSERVABLE</span>'+rows.map(row=>
    '<div class="mix-row"><span>'+row[0]+'</span><div class="mix-track"><span style="width:'+((Number(row[1])||0)/max*100)+'%"></span></div><strong>'+row[1]+'</strong></div>'
  ).join("")+'</div>';
}
function renderPerformanceSummary(runner){
  const projection=dashboard.challenge.finished?runner.km:runner.projection_km;
  const stats=[
    [dashboard.challenge.finished?"RESULTADO":"PROYECCIÓN",fmt(projection)+" KM"],
    ["APORTA AL CLUB",fmt(runner.contribution_pct)+"%"],
    ["SALIDAS",fmt(runner.outings_total,0)],
    ["DESNIVEL",fmt(runner.elevation_total_m,0)+" M D+"+(runner.elevation_total_complete?"":"*")]
  ];
  const tracked=runner.tracking;
  let observed='<div class="empty">Las métricas de rendimiento aparecerán cuando existan actividades posteriores al checkpoint. No se mezclan con históricos incompletos.</div>';
  if(tracked&&tracked.available){
    const metrics=[["KM / SALIDA",fmt(tracked.km_per_outing)+" KM"],["RITMO",fmtPace(tracked.weighted_pace_min_per_km)+" /KM"],["SALIDA MÁXIMA",fmt(tracked.longest_outing_km)+" KM"],["D+ / KM",fmt(tracked.elevation_m_per_km)+" M"]];
    observed='<div class="observable-summary">'+metrics.map(item=>'<div class="observable-stat"><span class="metric-label">'+item[0]+'</span><strong>'+item[1]+'</strong></div>').join("")+'</div>'+distributionHtml(tracked);
  }
  return '<section class="section">'+sectionHeading("PERFORMANCE SUMMARY","TOTAL + PERIODO OBSERVABLE")+'<div class="summary-strip">'+stats.map(item=>'<div class="summary-stat"><small>'+item[0]+'</small><strong>'+item[1]+'</strong></div>').join("")+'</div>'+observed+'</section>';
}
function runnerAccent(runner){
  return runner.rank===1?"#E1B94F":runner.rank===2?"#C5CBD2":runner.rank===3?"#B87342":isRelegationRunner(runner,dashboard.runners)?"#FF453A":"#D8FF3E";
}
function renderRunnerChart(runner){
  const canvas=document.getElementById("runnerChart");
  if(!canvas)return;
  if(typeof Chart==="undefined"){chartUnavailable(canvas);return}
  const sets=dashboard.series&&Array.isArray(dashboard.series.datasets)?dashboard.series.datasets:[];
  const set=sets.find(item=>item.slug===runner.slug);
  if(!set||!Array.isArray(set.cumulative_km)){chartUnavailable(canvas);return}
  const day=dataDay(dashboard);
  const anchor=Number(set.cumulative_km[day-1]||0);
  const actual=set.cumulative_km.map((value,index)=>index<day?value:null);
  const projection=set.cumulative_km.map((_,index)=>index<day-1?null:Math.round((anchor/day)*(index+1)*10)/10);
  const target=set.cumulative_km.map((_,index)=>Math.round(dashboard.challenge.objective_per_runner_km*(index+1)/dashboard.challenge.days*10)/10);
  const last=set.cumulative_km.length-1;
  const accent=runnerAccent(runner);
  const labels=[{datasetIndex:0,index:day-1,text:fmt(anchor,0)+" KM",color:"#090A0B",background:accent}];
  if(!dashboard.challenge.finished)labels.push({datasetIndex:1,index:last,text:fmt(projection[last],0)+" KM"});
  labels.push({datasetIndex:2,index:last,text:"TARGET "+fmt(target[last],0),color:"#92989F"});
  charts.push(new Chart(canvas,{type:"line",data:{labels:dashboard.series.labels.map((_,index)=>"D"+(index+1)),datasets:[
    {label:"Real",data:actual,borderColor:accent,backgroundColor:accent,borderWidth:3,pointRadius:context=>context.dataIndex===day-1?4:0,tension:.22,fill:false},
    {label:"Proyección",data:dashboard.challenge.finished?[]:projection,borderColor:"#F4F3EE",backgroundColor:"#F4F3EE",borderWidth:2,borderDash:[7,5],pointRadius:0,tension:.2,fill:false},
    {label:"Objetivo",data:target,borderColor:"#92989F",backgroundColor:"#92989F",borderWidth:1.5,borderDash:[2,5],pointRadius:0,fill:false}
  ]},options:chartBaseOptions(labels),plugins:[endLabelsPlugin]}));
}
function activityPace(item){
  const distance=Number(item.distance_km);
  const time=Number(item.moving_time_s);
  return distance>0&&time>0?time/60/distance:null;
}
function renderRecentActivities(runner){
  const tracked=runner.tracking;
  if(!tracked||!tracked.available||!Array.isArray(tracked.activities)||tracked.activities.length===0)return '<section class="section">'+sectionHeading("RECENT ACTIVITIES","TRAINING LOG")+'<div class="empty">Sin actividades observables posteriores al checkpoint.</div></section>';
  const items=tracked.activities.slice(0,6).map(item=>
    '<article class="activity"><div><div class="activity-date">'+fmtDate(item.date)+'</div><div class="activity-distance">'+fmt(item.distance_km)+' KM</div><div class="activity-basis">'+(item.date_basis==="exact"?"FECHA EXACTA":"FECHA DE DETECCIÓN")+'</div></div>'+
    '<div class="activity-metrics"><div class="activity-metric"><strong>'+fmtPace(activityPace(item))+' /KM</strong><span>RITMO</span></div><div class="activity-metric"><strong>'+fmt(item.elevation_m,0)+' M</strong><span>D+</span></div><div class="activity-metric"><strong>'+String(item.sport_type==="TrailRun"?"TRAIL":"RUN")+'</strong><span>TIPO</span></div></div></article>'
  ).join("");
  return '<section class="section">'+sectionHeading("RECENT ACTIVITIES","TRAINING LOG · SOLO PERIODO OBSERVABLE")+'<div class="activity-list">'+items+'</div></section>';
}
function renderMilestones(runner){
  const milestones=Array.isArray(runner.milestones)?runner.milestones:[];
  if(milestones.length===0)return '<section class="section">'+sectionHeading("MILESTONES","25 · 50 · 75 · 100")+'<div class="empty">Sin hitos disponibles.</div></section>';
  const cards=milestones.map(item=>{
    const done=item.status!=="pending";
    const detected=item.status==="detected";
    let text="PENDIENTE";
    if(item.status==="before_tracking")text="ALCANZADO ANTES DEL SEGUIMIENTO · FECHA NO DISPONIBLE";
    if(item.status==="detected")text="DETECTADO EL "+fmtDate(item.reached_on);
    if(item.status==="exact")text="ALCANZADO EL "+fmtDate(item.reached_on);
    return '<article class="milestone'+(done?" done":"")+(detected?" detected":"")+'"><div class="milestone-pct">'+item.pct+'%</div><div class="milestone-target">'+fmt(item.target_km,0)+' KM</div><div class="milestone-state">'+text+'</div></article>';
  }).join("");
  return '<section class="section">'+sectionHeading("MILESTONES","25 · 50 · 75 · 100")+'<div class="milestones">'+cards+'</div></section>';
}
function renderQuality(runner){
  const tracking=dashboard.quality.tracking_checkpoint?fmtDate(dashboard.quality.tracking_checkpoint):"PENDIENTE";
  const reconciliation=runner.leaderboard_adjustment?'<div class="quality-item"><strong>Reconciliación leaderboard</strong><span>+'+fmt(runner.leaderboard_adjustment.distance_km)+' km · '+runner.leaderboard_adjustment.outings+' salidas. No se inventan ritmo ni desnivel.</span></div>':"";
  const elevation=runner.elevation_total_complete?"":'<div class="quality-item"><strong>Desnivel parcial</strong><span>* El histórico no incluye el desnivel completo; no se estima lo no observado.</span></div>';
  const late=Number(dashboard.quality.late_observation_count||0)>0?'<div class="quality-item"><strong>Cierre tardío</strong><span>Las actividades detectadas el 31/08 se imputan al cierre del 30/08; la API del club no entrega su fecha exacta.</span></div>':"";
  return '<section class="section">'+sectionHeading("DATA QUALITY","TRAZABILIDAD")+'<div class="quality-card"><div class="quality-item"><strong>Totales acumulados</strong><span>Checkpoint histórico más incrementos observados. Consolidados hasta '+qualityDate()+'.</span></div>'+reconciliation+
    elevation+late+'<div class="quality-item"><strong>Eficiencia y actividades</strong><span>Solo desde el seguimiento detallado ('+tracking+'); nunca se extrapolan hacia atrás.</span></div>'+
    '<div class="quality-item"><strong>Fechas</strong><span>'+(dashboard.coverage.estimated_activity_dates?"La API no entrega la fecha exacta en este feed: se muestra cuándo se detectó la actividad.":"No hay actividades con fecha estimada.")+'</span></div></div></section>';
}
function renderRunner(runner){
  document.title=runner.name+" · "+SITE.name;
  app.innerHTML='<a class="back" href="./" data-route><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M16 10H4M9 5l-5 5 5 5"/></svg>Volver a clasificación</a>'+
    renderRunnerHero(runner)+renderPerformanceSummary(runner)+
    '<section class="section">'+sectionHeading("PROGRESS","EVOLUCIÓN INDIVIDUAL")+'<div class="chart-card"><div class="chart-wrap"><canvas id="runnerChart" role="img" aria-label="Evolución de '+esc(runner.name)+'"></canvas></div><p class="chart-note">La proyección parte del último total consolidado. Los intervalos sin desglose diario se muestran interpolados.</p></div></section>'+
    renderRecentActivities(runner)+renderMilestones(runner)+renderQuality(runner);
  renderRunnerChart(runner);
}
function render(){
  destroyCharts();
  renderHeader();
  const slug=routeSlug();
  const runner=slug?dashboard.runners.find(item=>item.slug===slug):null;
  if(slug&&!runner){history.replaceState({},"",location.pathname);renderHome()}
  else if(runner)renderRunner(runner);
  else renderHome();
  renderFooter();
  window.scrollTo({top:0,behavior:"auto"});
  if(hasRendered){
    const heading=app.querySelector("h1");
    if(heading){
      heading.setAttribute("tabindex","-1");
      heading.focus({preventScroll:true});
    }
  }
  hasRendered=true;
}
document.addEventListener("click",event=>{
  const link=event.target.closest("a[data-route]");
  if(!link||event.metaKey||event.ctrlKey||event.shiftKey||event.altKey)return;
  event.preventDefault();
  history.pushState({},"",link.getAttribute("href"));
  render();
});
window.addEventListener("popstate",()=>dashboard&&render());
fetch("./data.json",{cache:"no-store"})
  .then(response=>{if(!response.ok)throw new Error("HTTP "+response.status);return response.json()})
  .then(data=>{if(data.schema_version!==2||!Array.isArray(data.runners))throw new Error("Esquema de datos incompatible");dashboard=data;render()})
  .catch(error=>{console.error(error);siteHeader.innerHTML='<div class="topbar-inner"><span class="brand">'+SITE.name+' // '+SITE.challengeName+'</span></div>';app.innerHTML='<div class="empty" role="alert" style="margin-top:28px"><strong>DATOS NO DISPONIBLES</strong><br>No se ha podido cargar una clasificación válida. Inténtalo de nuevo en unos minutos.</div>'});
</script>
</body>
</html>
