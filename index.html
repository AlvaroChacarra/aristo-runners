<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17181a">
<meta name="description" content="Dashboard público del reto de verano de ARISTO runners">
<title>ARISTO runners · Reto de verano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root{
    --asphalt:#17181a;--surface:#212327;--surface-2:#292b30;--surface-3:#303238;
    --chalk:#f4f1e8;--muted:#9a9c93;--brick:#c1452b;--gold:#d6a23c;
    --turf:#4c8563;--lane:#35373a;--blue:#4d7ea8;--danger:#d05b42;
  }
  *{box-sizing:border-box}
  html{background:var(--asphalt);scroll-behavior:smooth}
  body{margin:0;background:var(--asphalt);color:var(--chalk);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button,a{-webkit-tap-highlight-color:transparent}
  :focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  .shell{max-width:920px;margin:0 auto;padding:0 20px calc(74px + env(safe-area-inset-bottom))}
  .topbar{height:58px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--lane);position:sticky;top:0;background:rgba(23,24,26,.94);backdrop-filter:blur(12px);z-index:20}
  .brand{font-family:'Oswald',sans-serif;font-size:17px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:9px}
  .brand-mark{width:10px;height:10px;border-radius:50%;background:var(--brick);box-shadow:0 0 0 4px rgba(193,69,43,.13)}
  .version{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);border:1px solid var(--lane);padding:5px 7px;border-radius:20px}
  .loading{min-height:70vh;display:grid;place-items:center;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted)}
  .hero{padding:42px 0 28px}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--brick);margin:0 0 12px}
  h1,h2,h3,p{margin-top:0}
  h1{font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;font-size:42px;line-height:.98;letter-spacing:.01em;margin-bottom:14px}
  h1 .accent{color:var(--brick)}
  .hero-copy{color:var(--muted);font-size:13px;line-height:1.55;max-width:650px;margin-bottom:0}
  .kpi-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:10px;margin-top:24px}
  .kpi{background:var(--surface);border:1px solid var(--lane);border-radius:13px;padding:16px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between}
  .kpi.primary{background:linear-gradient(145deg,#2a2416,var(--surface) 72%);border-color:#6f5725}
  .kpi-label{font-family:'JetBrains Mono',monospace;font-size:10px;line-height:1.35;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .kpi-value{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:25px;line-height:1;margin-top:16px}
  .kpi.primary .kpi-value{font-size:34px;color:var(--gold)}
  .kpi-unit{font-size:12px;color:var(--muted);font-weight:500}
  .kpi-note{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--muted);margin-top:7px;line-height:1.35}
  .positive{color:var(--turf)!important}.negative{color:var(--danger)!important}.warning{color:var(--gold)!important}
  .group-progress{height:11px;border-radius:10px;background:var(--lane);overflow:hidden;margin-top:14px}
  .group-progress>span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--brick),var(--gold));transition:width .4s ease}
  .notice{border:1px solid #6f5725;background:#2a2416;border-radius:11px;padding:12px 14px;margin-top:14px;font-family:'JetBrains Mono',monospace;font-size:10.5px;line-height:1.55;color:var(--gold)}
  .quality-strip{display:flex;align-items:flex-start;gap:9px;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:10px;line-height:1.5;margin-top:14px}
  .quality-dot{width:7px;height:7px;border-radius:50%;background:var(--turf);flex:0 0 auto;margin-top:4px}
  .quality-dot.pending{background:var(--gold)}
  .section{margin-top:38px}
  .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px}
  .section-title{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0;display:flex;align-items:center;gap:10px;flex:1}
  .section-title::after{content:"";height:1px;background:var(--lane);flex:1}
  .scope{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--gold);border:1px solid #6f5725;background:#2a2416;padding:5px 7px;border-radius:20px;white-space:nowrap}
  .chart-card{background:var(--surface);border:1px solid var(--lane);border-radius:13px;padding:18px 14px 12px}
  .chart-wrap{height:310px;position:relative}
  .chart-note{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--muted);line-height:1.5;margin:10px 2px 0}
  .board{display:flex;flex-direction:column;gap:8px}
  .runner-row{background:var(--surface);border:1px solid transparent;border-radius:12px;padding:14px 15px;display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;min-height:82px;transition:transform .15s ease,border-color .15s ease,background .15s ease}
  .runner-row:hover{transform:translateY(-1px);border-color:var(--lane);background:var(--surface-2)}
  .runner-row.leader{border-color:#6f5725;background:linear-gradient(90deg,#2a2416,var(--surface) 48%)}
  .rank{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:16px;color:var(--muted);text-align:center}
  .leader .rank{color:var(--gold)}
  .runner-name{font-family:'Oswald',sans-serif;font-size:17px;line-height:1.1;text-transform:uppercase}
  .runner-meta{font-family:'JetBrains Mono',monospace;font-size:9.5px;line-height:1.45;color:var(--muted);margin-top:5px}
  .runner-km{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;text-align:right;white-space:nowrap}
  .runner-km small{font-size:10px;color:var(--muted)}
  .chevron{color:var(--muted);font-size:16px;margin-left:8px}
  .mini-track{height:4px;background:var(--lane);border-radius:5px;overflow:hidden;margin-top:8px;max-width:360px}
  .mini-track span{display:block;height:100%;background:var(--brick);border-radius:inherit}
  .leader .mini-track span{background:var(--gold)}
  .status-chip{display:inline-flex;align-items:center;gap:4px;font-family:'JetBrains Mono',monospace;font-size:8px;text-transform:uppercase;letter-spacing:.04em;padding:3px 6px;border-radius:10px;margin-left:5px;background:rgba(76,133,99,.14);color:#72ae88}
  .status-chip.off{background:rgba(193,69,43,.12);color:#d77a65}
  .highlights{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .highlight{background:var(--surface);border:1px solid var(--lane);border-radius:12px;padding:16px;min-height:112px}
  .highlight-label{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--brick);text-transform:uppercase;letter-spacing:.06em;margin-bottom:9px}
  .highlight-name{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:18px;line-height:1.15}
  .highlight-value{font-family:'JetBrains Mono',monospace;color:var(--muted);font-size:11px;margin-top:5px}
  .empty{background:var(--surface);border:1px dashed var(--lane);border-radius:12px;padding:20px;color:var(--muted);font-size:12px;line-height:1.6}
  .back{display:inline-flex;align-items:center;min-height:44px;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:11px;margin-top:14px}
  .back span{font-size:18px;margin-right:8px}
  .runner-hero{padding:16px 0 8px}
  .runner-hero h1{font-size:40px;margin-bottom:17px}
  .runner-total{display:flex;align-items:flex-end;justify-content:space-between;gap:18px}
  .runner-total-value{font-family:'JetBrains Mono',monospace;font-size:42px;font-weight:700;line-height:1;color:var(--gold)}
  .runner-total-value small{font-size:15px;color:var(--muted)}
  .runner-total-side{text-align:right;font-family:'JetBrains Mono',monospace;font-size:10px;line-height:1.6;color:var(--muted)}
  .detail-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:20px}
  .detail-stat{background:var(--surface);border:1px solid var(--lane);border-radius:11px;padding:14px;min-height:92px}
  .detail-stat-value{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;margin-top:14px;white-space:nowrap}
  .efficiency-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
  .efficiency-card{background:var(--surface);border:1px solid var(--lane);border-radius:11px;padding:14px;min-height:100px}
  .efficiency-card .kpi-value{font-size:21px}
  .distribution{background:var(--surface);border:1px solid var(--lane);border-radius:12px;padding:16px;margin-top:10px}
  .distribution-row{display:grid;grid-template-columns:85px 1fr 24px;align-items:center;gap:10px;margin-top:11px;font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--muted)}
  .dist-track{height:7px;border-radius:7px;background:var(--lane);overflow:hidden}
  .dist-track span{display:block;height:100%;border-radius:inherit;background:var(--blue)}
  .activity-list{display:flex;flex-direction:column;gap:7px;margin-top:10px}
  .activity{background:var(--surface);border:1px solid var(--lane);border-radius:10px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .activity-date{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);margin-top:4px}
  .activity-value{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;white-space:nowrap}
  .milestones{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
  .milestone{background:var(--surface);border:1px solid var(--lane);border-radius:12px;padding:14px;min-height:134px;position:relative;overflow:hidden}
  .milestone.done{border-color:rgba(76,133,99,.65)}
  .milestone.detected{border-color:#6f5725;background:linear-gradient(145deg,#2a2416,var(--surface) 72%)}
  .milestone-pct{font-family:'JetBrains Mono',monospace;font-size:25px;font-weight:700;color:var(--muted)}
  .milestone.done .milestone-pct{color:var(--turf)}
  .milestone.detected .milestone-pct{color:var(--gold)}
  .milestone-state{font-family:'JetBrains Mono',monospace;font-size:8.5px;line-height:1.5;color:var(--muted);margin-top:18px}
  .quality-card{background:var(--surface);border:1px solid var(--lane);border-radius:12px;padding:16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
  .quality-item strong{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--chalk);margin-bottom:5px}
  .quality-item span{font-size:10px;color:var(--muted);line-height:1.5}
  footer{border-top:1px solid var(--lane);margin-top:42px;padding-top:18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--muted)}
  @media(max-width:720px){
    .shell{padding-left:14px;padding-right:14px}.hero{padding-top:30px}h1{font-size:32px}.kpi-grid{grid-template-columns:1fr 1fr}.kpi{min-height:104px;padding:14px}.kpi.primary .kpi-value{font-size:29px}.chart-wrap{height:270px}.detail-grid{grid-template-columns:1fr 1fr}.efficiency-grid{grid-template-columns:1fr 1fr}.runner-hero h1{font-size:32px}.quality-card{grid-template-columns:1fr}.milestones{grid-template-columns:1fr 1fr}.highlights{grid-template-columns:1fr 1fr}
  }
  @media(max-width:430px){
    .topbar{height:54px}.hero{padding-top:26px}.hero-copy{font-size:12px}.kpi-value{font-size:21px}.kpi.primary .kpi-value{font-size:27px}.section{margin-top:32px}.runner-row{grid-template-columns:28px 1fr auto;padding:13px 11px;gap:9px}.runner-name{font-size:15px}.runner-km{font-size:16px}.chevron{display:none}.runner-total-value{font-size:34px}.efficiency-grid{grid-template-columns:1fr 1fr}.milestone{min-height:124px}.highlights{grid-template-columns:1fr}.chart-card{padding-left:9px;padding-right:9px}
  }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="brand" href="./" data-route aria-label="Volver al resumen del club"><span class="brand-mark"></span>ARISTO runners</a>
    <span class="version">DASHBOARD V2</span>
  </header>
  <main id="app"><div class="loading">Cargando datos del reto…</div></main>
  <footer id="footer" hidden></footer>
</div>

<script>
const COLORS=['#d6a23c','#c1452b','#4c8563','#4d7ea8','#a85f8a','#6b5fa8','#3f9a8f','#8a5b7a','#94a84e','#b5772f','#8a8175','#607d8b'];
const app=document.getElementById('app');
const footer=document.getElementById('footer');
let dashboard=null;
let charts=[];

const fmt=(value,digits=1)=>value===null||value===undefined?'—':Number(value).toLocaleString('es-ES',{minimumFractionDigits:digits,maximumFractionDigits:digits});
const esc=value=>String(value).replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
const parseDate=value=>value?new Date(String(value).length===10?`${value}T12:00:00`:value):null;
const fmtDate=value=>{const date=parseDate(value);return date&&!Number.isNaN(date.valueOf())?date.toLocaleDateString('es-ES',{day:'numeric',month:'short'}):'—'};
const fmtDateTime=value=>{const date=parseDate(value);return date&&!Number.isNaN(date.valueOf())?date.toLocaleString('es-ES',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—'};
const fmtPace=value=>{if(value===null||value===undefined)return '—';const totalSeconds=Math.round(value*60);return `${Math.floor(totalSeconds/60)}:${String(totalSeconds%60).padStart(2,'0')}`};
const signed=value=>`${value>=0?'+':'−'}${fmt(Math.abs(value))}`;
const routeSlug=()=>new URLSearchParams(location.search).get('runner');
const dataDay=data=>Math.max(1,Math.min(data.challenge.days,Math.round((parseDate(data.data_through)-parseDate(data.challenge.start))/86400000)+1));
const targetWidth=pct=>Math.max(0,Math.min(100,pct));

function destroyCharts(){charts.forEach(chart=>chart.destroy());charts=[]}
function routeHref(slug){return `?runner=${encodeURIComponent(slug)}`}
function qualityDate(){return fmtDateTime(dashboard.quality.last_complete_observation)}

function chartBaseOptions(){
  return {responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:{callbacks:{label:context=>`${context.dataset.label}: ${fmt(context.parsed.y)} km`}}},scales:{x:{grid:{color:'#35373a'},ticks:{color:'#9a9c93',font:{family:"'JetBrains Mono', monospace",size:9},maxTicksLimit:9}},y:{grid:{color:'#35373a'},ticks:{color:'#9a9c93',font:{family:"'JetBrains Mono', monospace",size:9},callback:value=>`${value} km`}}}};
}

function renderGroupChart(){
  const canvas=document.getElementById('groupChart');
  if(!canvas||typeof Chart==='undefined')return;
  const day=dataDay(dashboard);
  const totals=dashboard.series.labels.map((_,index)=>dashboard.series.datasets.reduce((sum,set)=>sum+Number(set.cumulative_km[index]||0),0));
  const anchor=totals[day-1];
  const actual=totals.map((value,index)=>index<day?Math.round(value*100)/100:null);
  const projection=totals.map((_,index)=>index<day-1?null:Math.round((anchor/day)*(index+1)*10)/10);
  const target=totals.map((_,index)=>Math.round(dashboard.challenge.objective_total_km*(index+1)/dashboard.challenge.days*10)/10);
  charts.push(new Chart(canvas,{type:'line',data:{labels:dashboard.series.labels.map((_,index)=>`D${index+1}`),datasets:[
    {label:'Km reales del club',data:actual,borderColor:'#d6a23c',backgroundColor:'#d6a23c',borderWidth:3,pointRadius:context=>context.dataIndex===day-1?4:0,tension:.22,fill:false},
    {label:'Proyección',data:dashboard.challenge.finished?[]:projection,borderColor:'#d6a23c',backgroundColor:'#d6a23c',borderWidth:2,borderDash:[6,5],pointRadius:0,tension:.2,fill:false},
    {label:'Ritmo objetivo',data:target,borderColor:'#5a5c58',borderWidth:1.5,borderDash:[2,4],pointRadius:0,fill:false}
  ]},options:chartBaseOptions()}));
}

function homeKpis(){
  const summary=dashboard.summary;
  const projectionValue=dashboard.challenge.finished?summary.total_km:summary.projection_km;
  const gap=summary.projection_gap_km;
  const gapClass=gap>=0?'positive':'negative';
  return `
    <div class="kpi-grid">
      <article class="kpi primary"><span class="kpi-label">Kilómetros del club</span><div><div class="kpi-value">${fmt(summary.total_km)} <span class="kpi-unit">km</span></div><div class="kpi-note">de ${fmt(dashboard.challenge.objective_total_km,0)} km</div></div></article>
      <article class="kpi"><span class="kpi-label">Progreso conjunto</span><div><div class="kpi-value">${fmt(summary.progress_pct)}%</div><div class="kpi-note">${summary.completed_runners} han completado ${fmt(dashboard.challenge.objective_per_runner_km,0)} km</div></div></article>
      <article class="kpi"><span class="kpi-label">${dashboard.challenge.finished?'Resultado final':'Proyección final'}</span><div><div class="kpi-value">${fmt(projectionValue)} <span class="kpi-unit">km</span></div><div class="kpi-note ${gapClass}">${signed(gap)} km vs objetivo</div></div></article>
      <article class="kpi"><span class="kpi-label">Corredores en ritmo</span><div><div class="kpi-value">${summary.on_track_runners}<span class="kpi-unit"> / ${summary.participants}</span></div><div class="kpi-note">según proyección actual</div></div></article>
    </div>`;
}

function runnerRows(){
  return dashboard.runners.map(runner=>{
    const pace=runner.pace_required_km_per_day===null?'reto finalizado':`necesita ${fmt(runner.pace_required_km_per_day,2)} km/día`;
    const elevation=`${fmt(runner.elevation_total_m,0)} m D+${runner.elevation_total_complete?'':'*'}`;
    return `<a class="runner-row${runner.rank===1?' leader':''}" href="${routeHref(runner.slug)}" data-route aria-label="Ver estadísticas de ${esc(runner.name)}">
      <div class="rank">${runner.rank}</div>
      <div><div class="runner-name">${esc(runner.name)} <span class="status-chip${runner.on_track?'':' off'}">${runner.on_track?'en ritmo':'por debajo'}</span></div><div class="runner-meta">${runner.outings_total} salidas · ${elevation} · ${fmt(runner.progress_pct)}%</div><div class="runner-meta">faltan ${fmt(runner.remaining_km)} km · ${pace}</div><div class="mini-track" role="progressbar" aria-valuenow="${runner.progress_pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${targetWidth(runner.progress_pct)}%"></span></div></div>
      <div class="runner-km">${fmt(runner.km)} <small>km</small><span class="chevron">›</span></div>
    </a>`;
  }).join('');
}

function highlightCards(){
  const icons={leader:'🏆',closest:'🎯',longest_tracked:'🦕',best_average_tracked:'📏',latest_milestone:'🚀'};
  return dashboard.highlights.cards.map(card=>`<a class="highlight" href="${routeHref(card.runner_slug)}" data-route><div class="highlight-label">${icons[card.kind]||'•'} ${esc(card.label)}</div><div class="highlight-name">${esc(card.name)}</div><div class="highlight-value">${esc(card.value)}${card.scope==='post_tracking_checkpoint'?' · desde seguimiento detallado':''}</div></a>`).join('');
}

function qualityStrip(){
  const pending=dashboard.coverage.needs_current_baseline;
  return `<div class="quality-strip"><span class="quality-dot${pending?' pending':''}"></span><span>Totales consolidados hasta ${qualityDate()}.${dashboard.quality.last_feed_check?` Feed consultado ${fmtDateTime(dashboard.quality.last_feed_check)}.`:''} ${pending?'Falta el checkpoint actual para activar los incrementos automáticos.':'Seguimiento incremental activo.'}</span></div>`;
}

function renderHome(){
  const challenge=dashboard.challenge;
  app.innerHTML=`
    <section class="hero">
      <p class="eyebrow">Alcobendas, Madrid · ${challenge.finished?'clasificación final':`día ${challenge.current_day} de ${challenge.days}`}</p>
      <h1>Reto de verano<br><span class="accent">ARISTO runners</span></h1>
      <p class="hero-copy">${challenge.finished?'Resultado definitivo del reto.':`${fmt(challenge.objective_per_runner_km,0)} km por corredor antes del 30 de agosto.`}</p>
      ${homeKpis()}
      <div class="group-progress" role="progressbar" aria-label="Progreso conjunto" aria-valuenow="${dashboard.summary.progress_pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${targetWidth(dashboard.summary.progress_pct)}%"></span></div>
      ${dashboard.coverage.needs_current_baseline?'<div class="notice">La automatización está conectada, pero los totales recientes aún no se suman: falta incorporar una única fotografía actual de los 12 corredores.</div>':''}
      ${qualityStrip()}
    </section>
    <section class="section"><div class="section-head"><h2 class="section-title">Evolución del club</h2></div><div class="chart-card"><div class="chart-wrap"><canvas id="groupChart" aria-label="Evolución de kilómetros del club"></canvas></div><p class="chart-note">Sólida = total consolidado · discontinua = proyección · gris = ritmo necesario para ${fmt(challenge.objective_total_km,0)} km. Los tramos entre checkpoints sin detalle diario son interpolados.</p></div></section>
    <section class="section"><div class="section-head"><h2 class="section-title">Clasificación</h2><span class="scope">TOCA PARA VER DETALLE</span></div><div class="board">${runnerRows()}</div>${dashboard.summary.elevation_total_complete?'':'<p class="chart-note">* Desnivel histórico incompleto para Antonio, Kike y Alonso según la golden source.</p>'}</section>
    <section class="section"><div class="section-head"><h2 class="section-title">Hitos y destacados</h2></div><div class="highlights">${highlightCards()}</div>${dashboard.quality.activity_metrics_available?'':'<p class="chart-note">Los destacados de eficiencia aparecerán automáticamente cuando comience el seguimiento detallado de nuevas salidas.</p>'}</section>`;
  renderGroupChart();
}

function detailStats(runner){
  const projection=dashboard.challenge.finished?runner.km:runner.projection_km;
  return `<div class="detail-grid">
    <article class="detail-stat"><span class="kpi-label">Km restantes</span><div class="detail-stat-value">${fmt(runner.remaining_km)} <span class="kpi-unit">km</span></div></article>
    <article class="detail-stat"><span class="kpi-label">Necesita por día</span><div class="detail-stat-value">${runner.pace_required_km_per_day===null?'—':fmt(runner.pace_required_km_per_day,2)} <span class="kpi-unit">km</span></div></article>
    <article class="detail-stat"><span class="kpi-label">${dashboard.challenge.finished?'Resultado':'Proyección'}</span><div class="detail-stat-value">${fmt(projection)} <span class="kpi-unit">km</span></div></article>
    <article class="detail-stat"><span class="kpi-label">Aporta al club</span><div class="detail-stat-value">${fmt(runner.contribution_pct)}<span class="kpi-unit">%</span></div></article>
  </div>`;
}

function renderRunnerChart(runner){
  const canvas=document.getElementById('runnerChart');
  if(!canvas||typeof Chart==='undefined')return;
  const set=dashboard.series.datasets.find(item=>item.slug===runner.slug);
  const day=dataDay(dashboard);
  const anchor=set.cumulative_km[day-1];
  const actual=set.cumulative_km.map((value,index)=>index<day?value:null);
  const projection=set.cumulative_km.map((_,index)=>index<day-1?null:Math.round((anchor/day)*(index+1)*10)/10);
  const target=set.cumulative_km.map((_,index)=>Math.round(dashboard.challenge.objective_per_runner_km*(index+1)/dashboard.challenge.days*10)/10);
  const color=COLORS[(runner.rank-1)%COLORS.length];
  charts.push(new Chart(canvas,{type:'line',data:{labels:dashboard.series.labels.map((_,index)=>`D${index+1}`),datasets:[
    {label:'Km acumulados',data:actual,borderColor:color,backgroundColor:color,borderWidth:3,pointRadius:context=>context.dataIndex===day-1?4:0,tension:.22,fill:false},
    {label:'Proyección',data:dashboard.challenge.finished?[]:projection,borderColor:color,borderWidth:2,borderDash:[6,5],pointRadius:0,tension:.2,fill:false},
    {label:`Ritmo para ${fmt(dashboard.challenge.objective_per_runner_km,0)} km`,data:target,borderColor:'#5a5c58',borderWidth:1.5,borderDash:[2,4],pointRadius:0,fill:false}
  ]},options:chartBaseOptions()}));
}

function efficiency(runner){
  const tracked=runner.tracking;
  if(!tracked.available){
    return `<div class="empty"><strong>Sin actividades posteriores al checkpoint.</strong><br>Km/salida, ritmo, salida máxima, desnivel/km y distribución se activarán con las nuevas actividades. No se mezclan con históricos incompletos.</div>`;
  }
  return `<div class="efficiency-grid">
    <article class="efficiency-card"><span class="kpi-label">Salidas</span><div class="kpi-value">${tracked.outings}</div></article>
    <article class="efficiency-card"><span class="kpi-label">Km registrados</span><div class="kpi-value">${fmt(tracked.distance_km)} <span class="kpi-unit">km</span></div></article>
    <article class="efficiency-card"><span class="kpi-label">Km por salida</span><div class="kpi-value">${fmt(tracked.km_per_outing)} <span class="kpi-unit">km</span></div></article>
    <article class="efficiency-card"><span class="kpi-label">Salida máxima</span><div class="kpi-value">${fmt(tracked.longest_outing_km)} <span class="kpi-unit">km</span></div></article>
    <article class="efficiency-card"><span class="kpi-label">Ritmo ponderado</span><div class="kpi-value">${fmtPace(tracked.weighted_pace_min_per_km)} <span class="kpi-unit">/km</span></div></article>
    <article class="efficiency-card"><span class="kpi-label">Desnivel por km</span><div class="kpi-value">${fmt(tracked.elevation_m_per_km)} <span class="kpi-unit">m/km</span></div></article>
  </div>${distribution(tracked)}${activities(tracked)}`;
}

function distribution(tracked){
  const rows=[['Menos de 5 km',tracked.distribution.short_under_5k],['Entre 5 y 10',tracked.distribution.medium_5_to_10k],['10 km o más',tracked.distribution.long_10k_plus]];
  const max=Math.max(1,...rows.map(row=>row[1]));
  return `<div class="distribution"><span class="kpi-label">Distribución de salidas</span>${rows.map(row=>`<div class="distribution-row"><span>${row[0]}</span><div class="dist-track"><span style="width:${row[1]/max*100}%"></span></div><strong>${row[1]}</strong></div>`).join('')}</div>`;
}

function activities(tracked){
  const items=tracked.activities.slice(0,6).map(item=>`<div class="activity"><div><strong>${item.sport_type==='TrailRun'?'Trail run':'Carrera'}</strong><div class="activity-date">${item.date_basis==='exact'?'Fecha':'Detectada'} · ${fmtDate(item.date)} · ${fmt(item.elevation_m,0)} m D+</div></div><div class="activity-value">${fmt(item.distance_km)} km</div></div>`).join('');
  return `<div class="activity-list">${items}</div>`;
}

function milestoneCards(runner){
  return runner.milestones.map(item=>{
    const done=item.status!=='pending';
    const detected=item.status==='detected';
    let text='Pendiente';
    if(item.status==='before_tracking')text=`Alcanzado antes del seguimiento detallado; fecha exacta no disponible`;
    if(item.status==='detected')text=`Detectado el ${fmtDate(item.reached_on)}`;
    if(item.status==='exact')text=`Alcanzado el ${fmtDate(item.reached_on)}`;
    return `<article class="milestone${done?' done':''}${detected?' detected':''}"><div class="milestone-pct">${item.pct}%</div><div class="kpi-note">${fmt(item.target_km,0)} km</div><div class="milestone-state">${text}</div></article>`;
  }).join('');
}

function qualityCard(runner){
  const tracking=dashboard.quality.tracking_checkpoint?fmtDate(dashboard.quality.tracking_checkpoint):'pendiente';
  return `<div class="quality-card">
    <div class="quality-item"><strong>Totales acumulados</strong><span>Checkpoint histórico más incrementos observados. Consolidados hasta ${qualityDate()}.</span></div>
    <div class="quality-item"><strong>Eficiencia y actividades</strong><span>Solo desde el seguimiento detallado (${tracking}); nunca se extrapolan hacia atrás.</span></div>
    <div class="quality-item"><strong>Fechas</strong><span>${dashboard.coverage.estimated_activity_dates?'La API no entrega fecha: se muestra cuándo se detectó la actividad.':'No hay nuevas actividades con fecha estimada.'}</span></div>
  </div>`;
}

function renderRunner(runner){
  app.innerHTML=`
    <a class="back" href="./" data-route><span>‹</span>Volver al club</a>
    <section class="runner-hero"><p class="eyebrow">Puesto ${runner.rank} · ${runner.on_track?'en ritmo de objetivo':'por debajo del ritmo'}</p><h1>${esc(runner.name)}</h1><div class="runner-total"><div class="runner-total-value">${fmt(runner.km)} <small>km</small></div><div class="runner-total-side">${fmt(runner.progress_pct)}% de ${fmt(dashboard.challenge.objective_per_runner_km,0)} km<br>${fmt(runner.contribution_pct)}% del club<br>${runner.outings_total} salidas · ${fmt(runner.elevation_total_m,0)} m D+${runner.elevation_total_complete?'':'*'}</div></div><div class="group-progress" role="progressbar" aria-label="Progreso de ${esc(runner.name)}" aria-valuenow="${runner.progress_pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${targetWidth(runner.progress_pct)}%"></span></div>${detailStats(runner)}</section>
    <section class="section"><div class="section-head"><h2 class="section-title">Evolución individual</h2></div><div class="chart-card"><div class="chart-wrap"><canvas id="runnerChart" aria-label="Evolución de ${esc(runner.name)}"></canvas></div><p class="chart-note">La proyección usa el último total consolidado. Los intervalos sin desglose diario aparecen interpolados.</p></div></section>
    <section class="section"><div class="section-head"><h2 class="section-title">Eficiencia de las salidas</h2><span class="scope">SOLO PERIODO OBSERVABLE</span></div>${efficiency(runner)}</section>
    <section class="section"><div class="section-head"><h2 class="section-title">Hitos del reto</h2></div><div class="milestones">${milestoneCards(runner)}</div></section>
    <section class="section"><div class="section-head"><h2 class="section-title">Calidad del dato</h2></div>${qualityCard(runner)}</section>`;
  renderRunnerChart(runner);
}

function render(){
  destroyCharts();
  const slug=routeSlug();
  const runner=slug?dashboard.runners.find(item=>item.slug===slug):null;
  if(slug&&!runner){history.replaceState({},'',location.pathname);renderHome()}else if(runner){renderRunner(runner)}else{renderHome()}
  footer.hidden=false;
  footer.innerHTML=`<span>Objetivo · ${fmt(dashboard.challenge.objective_per_runner_km,0)} km × ${dashboard.summary.participants} corredores</span><span>Último dato completo · ${qualityDate()}</span>`;
  window.scrollTo({top:0,behavior:'auto'});
}

document.addEventListener('click',event=>{
  const link=event.target.closest('a[data-route]');
  if(!link||event.metaKey||event.ctrlKey||event.shiftKey||event.altKey)return;
  event.preventDefault();history.pushState({},'',link.getAttribute('href'));render();
});
window.addEventListener('popstate',()=>dashboard&&render());

fetch('./data.json',{cache:'no-store'})
  .then(response=>{if(!response.ok)throw new Error(`HTTP ${response.status}`);return response.json()})
  .then(data=>{if(data.schema_version!==2)throw new Error('Esquema de datos incompatible');dashboard=data;render()})
  .catch(error=>{console.error(error);app.innerHTML='<div class="empty" style="margin-top:28px"><strong>No se pudieron cargar los datos.</strong><br>La última versión válida seguirá publicada. Inténtalo de nuevo en unos minutos.</div>'});
</script>
</body>
</html>
